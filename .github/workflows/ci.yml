name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Ubuntu release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore NdsForge.slnx --locked-mode
      - name: Resolve package version
        shell: pwsh
        run: |
          $output = & dotnet msbuild src/NdsForge/NdsForge.csproj -nologo -getProperty:PackageVersion
          if ($LASTEXITCODE -ne 0) { throw "Package version resolution failed." }
          $version = ($output | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Package version is empty." }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Audit dependencies
        shell: pwsh
        run: ./build/verify-dependencies.ps1
      - name: Verify formatting
        run: dotnet format NdsForge.slnx --verify-no-changes --no-restore
      - name: Enforce source-size limit
        shell: pwsh
        run: ./build/verify-source-size.ps1
      - name: Build solution
        run: dotnet build NdsForge.slnx --configuration Release --no-restore
      - name: Run portable tests with coverage
        shell: pwsh
        run: ./build/test-portable.ps1
      - name: Build coverage report
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator "-reports:artifacts/test-results/**/coverage.cobertura.xml" "-targetdir:artifacts/coverage" "-reporttypes:Cobertura;Html"
      - name: Enforce coverage
        shell: pwsh
        run: ./build/verify-coverage.ps1 artifacts/coverage/Cobertura.xml
      - name: Pack library and tool
        run: |
          dotnet pack src/NdsForge/NdsForge.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/NdsForge.Nitro/NdsForge.Nitro.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/NdsForge.Graphics/NdsForge.Graphics.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/NdsForge.Audio.Wav/NdsForge.Audio.Wav.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/NdsForge.Cli/NdsForge.Cli.csproj --configuration Release --no-build --output artifacts/packages
      - name: Validate packages and symbols
        shell: pwsh
        run: |
          ./build/validate-package.ps1 "artifacts/packages/NdsForge.$env:PACKAGE_VERSION.nupkg" NdsForge $env:PACKAGE_VERSION
          ./build/validate-package.ps1 "artifacts/packages/NdsForge.Nitro.$env:PACKAGE_VERSION.nupkg" NdsForge.Nitro $env:PACKAGE_VERSION
          ./build/validate-package.ps1 "artifacts/packages/NdsForge.Graphics.$env:PACKAGE_VERSION.nupkg" NdsForge.Graphics $env:PACKAGE_VERSION
          ./build/validate-package.ps1 "artifacts/packages/NdsForge.Audio.Wav.$env:PACKAGE_VERSION.nupkg" NdsForge.Audio.Wav $env:PACKAGE_VERSION
          ./build/validate-package.ps1 "artifacts/packages/NdsForge.Cli.$env:PACKAGE_VERSION.nupkg" NdsForge.Cli $env:PACKAGE_VERSION
      - name: Test clean package consumers
        shell: pwsh
        run: ./build/test-package-consumer.ps1 artifacts/packages $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-ubuntu
          path: artifacts
          if-no-files-found: warn
          retention-days: 3

  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore NdsForge.slnx --locked-mode
      - name: Build solution
        run: dotnet build NdsForge.slnx --configuration Release --no-restore
      - name: Run Windows tests
        shell: pwsh
        run: |
          dotnet test tests/NdsForge.Tests/NdsForge.Tests.csproj --configuration Release --no-build --no-restore --results-directory artifacts/windows --logger "trx;LogFileName=core.trx"
          if ($LASTEXITCODE -ne 0) { throw "Core Windows tests failed." }
          dotnet test tests/NdsForge.Nitro.Tests/NdsForge.Nitro.Tests.csproj --configuration Release --no-build --no-restore --results-directory artifacts/windows --logger "trx;LogFileName=nitro.trx"
          if ($LASTEXITCODE -ne 0) { throw "Nitro Windows tests failed." }
          dotnet test tests/NdsForge.Graphics.Tests/NdsForge.Graphics.Tests.csproj --configuration Release --no-build --no-restore --results-directory artifacts/windows --logger "trx;LogFileName=graphics.trx"
          if ($LASTEXITCODE -ne 0) { throw "Graphics Windows tests failed." }
          dotnet test tests/NdsForge.Audio.Wav.Tests/NdsForge.Audio.Wav.Tests.csproj --configuration Release --no-build --no-restore --results-directory artifacts/windows --logger "trx;LogFileName=wav.trx"
          if ($LASTEXITCODE -ne 0) { throw "WAV Windows tests failed." }
      - name: Verify Windows test discovery
        shell: pwsh
        run: |
          ./build/verify-test-result.ps1 artifacts/windows/core.trx "Windows core portability"
          ./build/verify-test-result.ps1 artifacts/windows/nitro.trx "Windows Nitro portability"
          ./build/verify-test-result.ps1 artifacts/windows/graphics.trx "Windows graphics portability"
          ./build/verify-test-result.ps1 artifacts/windows/wav.trx "Windows WAV portability"
