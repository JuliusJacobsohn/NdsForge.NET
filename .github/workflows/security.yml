name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore NdsForge.slnx --locked-mode
      - name: Audit dependencies
        shell: pwsh
        run: ./build/verify-dependencies.ps1
      - name: Exercise parsers and safety policies
        run: dotnet test tests/NdsForge.Tests/NdsForge.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=security.trx" --results-directory artifacts/security
      - name: Verify security-test discovery
        shell: pwsh
        run: ./build/verify-test-result.ps1 artifacts/security/security.trx "security regression"
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
