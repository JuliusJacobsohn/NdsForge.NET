name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish all NuGet packages and create the stable GitHub release
        required: true
        default: false
        type: boolean
      commit:
        description: Optional exact main commit to retry (empty means current main)
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  release:
    name: Verify and publish a main release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
    steps:
      # Never check out a pull request or consume artifacts from an untrusted CI run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Resolve and validate release identity
        id: identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.release }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: ./build/resolve-release.ps1
      - name: Require successful cross-platform main CI for the exact commit
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = & gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:RELEASE_COMMIT --limit 30 --json status,conclusion,headBranch,event,headSha
          if ($LASTEXITCODE -ne 0) { throw "Querying CI failed." }
          $runs = @($json | ConvertFrom-Json)
          if (-not ($runs | Where-Object {
              $_.status -eq 'completed' -and $_.conclusion -eq 'success' -and
              $_.headBranch -eq 'main' -and $_.headSha -eq $env:RELEASE_COMMIT -and
              $_.event -in @('push', 'workflow_dispatch')
          })) { throw "Publishing requires successful main CI for this exact commit." }
      - name: Run complete release gate
        if: steps.identity.outputs.prepare == 'true'
        shell: pwsh
        run: ./build/build.ps1
      - name: Assemble and revalidate payload
        if: steps.identity.outputs.prepare == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          foreach ($id in @('NdsForge', 'NdsForge.Nitro', 'NdsForge.Graphics', 'NdsForge.Audio.Wav', 'NdsForge.Cli')) {
            Copy-Item -LiteralPath "artifacts/packages/$id.$env:PACKAGE_VERSION.nupkg" -Destination artifacts/release
            Copy-Item -LiteralPath "artifacts/packages/$id.$env:PACKAGE_VERSION.snupkg" -Destination artifacts/release
            ./build/validate-package.ps1 "artifacts/release/$id.$env:PACKAGE_VERSION.nupkg" $id $env:PACKAGE_VERSION
          }
          ./build/test-package-consumer.ps1 artifacts/release $env:PACKAGE_VERSION
      - name: Create checksums and release notes
        if: steps.identity.outputs.prepare == 'true'
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath artifacts/release -File |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllLines('artifacts/release/SHA256SUMS', $lines, [System.Text.UTF8Encoding]::new($false))
          $changelog = Get-Content -Raw -LiteralPath CHANGELOG.md
          . ./build/release-policy.ps1
          $notes = Get-ReleaseNotes $changelog $env:PACKAGE_VERSION
          [System.IO.File]::WriteAllText('artifacts/release-notes.md', $notes, [System.Text.UTF8Encoding]::new($false))
      - name: Bind release tag to verified commit
        if: steps.identity.outputs.publish == 'true' && steps.identity.outputs.tag_existed == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:RELEASE_TAG $env:RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Creating release tag failed." }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Publishing release tag failed." }
      - name: Authenticate with NuGet.org
        if: steps.identity.outputs.publish == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: JuliusJacobsohn
      - name: Publish NuGet packages and symbols
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($id in @('NdsForge', 'NdsForge.Nitro', 'NdsForge.Graphics', 'NdsForge.Audio.Wav', 'NdsForge.Cli')) {
            dotnet nuget push "artifacts/release/$id.$env:PACKAGE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $id failed. Retry this exact release commit." }
          }
      - name: Verify public NuGet downloads and clean consumers
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        run: ./build/verify-published-packages.ps1 -Version $env:PACKAGE_VERSION
      - name: Create stable GitHub release
        if: steps.identity.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --title "NdsForge.NET $PACKAGE_VERSION" --notes-file artifacts/release-notes.md
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --title "NdsForge.NET $PACKAGE_VERSION" --notes-file artifacts/release-notes.md --verify-tag
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.identity.outputs.prepare == 'true'
        with:
          name: release-${{ steps.identity.outputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/release
            artifacts/release-notes.md
            artifacts/test-results
            artifacts/coverage/Cobertura.xml
          if-no-files-found: warn
          retention-days: 14
